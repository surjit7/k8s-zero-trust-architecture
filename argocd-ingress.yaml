apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    # Crucial: Tells the Ingress Controller to talk to ArgoCD securely
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  # Use the same TLS secret you created earlier
  tls:
  - hosts:
    - argocd.myapp.com
    secretName: my-tls-secret
  rules:
  - host: argocd.myapp.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              name: https  # ArgoCD names its 443 port 'https'
