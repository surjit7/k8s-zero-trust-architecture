apiVersion: v1
kind: ServiceAccount
metadata:
  name: flask-api
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flask-api-role
  namespace: default
rules:
  # Example: Allow the app to list and watch pods in its own namespace
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flask-api-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: flask-api
    namespace: default
roleRef:
  kind: Role
  name: flask-api-role
  apiGroup: rbac.authorization.k8s.io
