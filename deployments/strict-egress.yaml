apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: strict-outbound-fqdn
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: flask-app  # <--- MAKE SURE THIS MATCHES YOUR DEPLOYMENT

  egress:
    # 1. ALLOW AND INSPECT DNS (Layer 7 Proxy)
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          k8s:k8s-app: kube-dns
      toPorts:
      - ports:
        - port: "53"
          protocol: ANY
        rules:
          dns:
            - matchPattern: "*"  # <--- THIS TELLS CILIUM TO MEMORIZE THE IPs

    # 2. ALLOW HTTPS egress to specific domains
    - toFQDNs:
      - matchName: "google.com"
      - matchName: "stripe.com"
      - matchName: "github.com"
      - matchPattern: "**.github.com"
      toPorts:
      - ports:
        - port: "443"
          protocol: TCP